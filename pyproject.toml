[project]
name = "mokioclaw"
version = "0.1.0"
description = "A teaching-first mini CodeAgent built from ToolCall to Claw."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.15",
    "langchain-openai>=1.1.13",
    "langgraph>=1.1.6",
    "pillow>=11.0.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "tavily-python>=0.7.24",
    "textual>=8.2.4",
    "typer>=0.16.0",
]

[project.scripts]
mokioclaw = "mokioclaw.cli.app:app"
mokioclaw-eval = "mokioclaw.evals.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
addopts = "-ra -p no:launch_testing -p no:launch_ros"
timeout = 30
testpaths = ["tests"]
markers = [
    "docker: requires a local Docker daemon and the evaluation image",
]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
